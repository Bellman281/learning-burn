[package]
name = "c1e8_norm"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.22.0", features = ["flex"] }
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "histogram",
    # ab_glyph rasterises fonts in pure Rust; "ttf" would need libfontconfig1-dev
    "ab_glyph",
] }
